<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | dedeseptian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--secondary);
        }
        .login-card {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border-color);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-family: inherit;
            transition: var(--transition);
        }
        input:focus {
            outline: none;
            border-color: var(--accent-google-blue);
            box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.1);
        }
        .error-msg {
            color: var(--accent-google-red);
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <a href="../index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
                <span class="logo-dot"></span>
                dedeseptian<span class="gradient-text">.</span>
            </a>
            <h2 style="font-size: 1.5rem;">Akses Admin</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Masuk untuk mengelola portofolio Anda</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group" style="margin-bottom: 2rem;">
                <label>Kata Sandi</label>
                <input type="password" id="password" placeholder="Masukkan kata sandi" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Masuk Sekarang</button>
            <div id="error-msg" class="error-msg">Kredensial salah. Silakan coba lagi.</div>
        </form>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/firebase-config.js"></script>

    <script src="../assets/js/storage.js"></script>
    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            const success = await Storage.authenticate(user, pass);
            if (success) {
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        };
    </script>
</body>
</html>
